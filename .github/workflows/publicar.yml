name: Publicar predespacho / redespacho en Slack

on:
  schedule:
    # Horas en UTC (Guatemala = UTC-6)
    - cron: "*/10 21-23 * * 5"    # viernes 3:00–5:50 PM: predespacho de la semana siguiente
    - cron: "7 12-23 * * *"       # todos los días, cada hora de 6 AM a 5 PM: redespachos
    - cron: "7 0-4 * * *"         # y de 6 PM a 10 PM
  # Si se sube un Excel a mano a data/
  push:
    paths:
      - "data/**.xlsx"
  # Botón "Run workflow" en la pestaña Actions (probar o re-publicar)
  workflow_dispatch:
    inputs:
      forzar:
        description: "Nombre exacto de un Excel para volver a publicarlo (opcional)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    outputs:
      nuevos: ${{ steps.desc.outputs.nuevos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests openpyxl
      - name: Revisar la AMM y descargar archivos nuevos
        id: desc
        run: python scripts/descargar.py
      - name: Guardar archivos descargados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "AMM: archivos nuevos de despacho semanal" && (git pull --rebase -q origin main; git push))

  publicar:
    needs: revisar
    if: needs.revisar.outputs.nuevos == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          pip install openpyxl requests playwright
          python -m playwright install --with-deps chromium
      - name: Generar imágenes y publicar en Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ -n "${{ github.event.inputs.forzar }}" ]; then
            python scripts/publicar.py --forzar "${{ github.event.inputs.forzar }}"
          else
            python scripts/publicar.py
          fi
      - name: Guardar imágenes y registro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add imagenes/ data/publicados.txt
          git diff --cached --quiet || (git commit -m "Imágenes publicadas en Slack" && (git pull --rebase -q origin main; git push))

name: explorar-amm
on:
  push:
    branches: [explorar]
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf explorar; mkdir -p explorar
          curl -sL -A "Mozilla/5.0" "https://www.amm.org.gt/posdes.php?fecha=20261021&mes=10&anio=2026" -o explorar/posdes.html || true
          cat explorar/posdes.html
          for u in $(grep -oiE 'href="[^"]+\.(xlsx?|pdf|zip)"' explorar/posdes.html | cut -d'"' -f2 | sort -u); do
            curl -sL -A "Mozilla/5.0" "$u" -o "explorar/$(basename "$u")" || true
          done
          ls -la explorar
          git config user.name bot; git config user.email bot@x
          git add explorar && git commit -m explorar && git push origin explorar

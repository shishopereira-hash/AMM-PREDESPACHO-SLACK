name: explorar-amm
on:
  push:
    branches: [explorar]
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf explorar; mkdir -p explorar
          curl -sL -A "Mozilla/5.0" "https://www.amm.org.gt/js/informes.js" -o explorar/informes.js || true
          curl -sL -A "Mozilla/5.0" "https://www.amm.org.gt/diarios-vwp_resu.php" -o explorar/diarios_resu.html || true
          curl -sL -A "Mozilla/5.0" "https://www.amm.org.gt/" -o explorar/home.html || true
          ls -la explorar
          git config user.name bot; git config user.email bot@x
          git add explorar && git commit -m explorar && git push origin explorar

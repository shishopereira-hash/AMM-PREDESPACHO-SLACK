name: explorar-amm
on:
  push:
    branches: [explorar]
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests openpyxl && python explorar/saa.py
      - run: |
          git config user.name bot; git config user.email bot@x
          git add explorar/saa_b2.csv && git commit -m saa && git push origin explorar

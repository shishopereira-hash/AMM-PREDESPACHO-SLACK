name: explorar-amm
on:
  push:
    branches: [explorar]
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf explorar; mkdir -p explorar
          for d in 20261021 20261022; do
            curl -sL -A "Mozilla/5.0" -D explorar/h_$d.txt "https://www.amm.org.gt/pdfs2/post_despacho/POSDESPACHO_DIARIO/2026/10_OCTUBRE/PD$d.zip" -o explorar/PD$d.zip || true
          done
          ls -la explorar
          git config user.name bot; git config user.email bot@x
          git add explorar && git commit -m explorar && git push origin explorar

name: Publicar posdespacho diario en Slack

# La AMM publica el posdespacho del día anterior alrededor de las 12:00 PM (Guatemala, UTC-6).
# Para publicarlo casi en cuanto sale, un trabajo arranca antes de las 12 con todo instalado
# y revisa la AMM cada minuto hasta que aparece (o hasta las 3:00 PM).
on:
  schedule:
    - cron: "35 17 * * *"     # 11:35 AM: inicia la vigilancia (GitHub puede atrasar el arranque unos minutos)
    - cron: "17 21-23 * * *"  # 3–5 PM cada hora, por si la AMM se atrasa más
  workflow_dispatch:
    inputs:
      forzar:
        description: "Fecha AAAAMMDD de un posdespacho para volver a publicarlo (opcional)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: posdespacho
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          pip install openpyxl requests playwright
          python -m playwright install --with-deps chromium
      - name: Vigilar la AMM y publicar en cuanto salga
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          FORZAR: ${{ github.event.inputs.forzar }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          guardar() {
            git add data/ imagenes/
            git diff --cached --quiet && return 0
            git commit -m "Posdespacho publicado en Slack"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q && return 0; sleep 5; done
          }
          if [ -n "$FORZAR" ]; then
            python scripts/posdespacho.py --solo-publicar --forzar "$FORZAR"; guardar; exit 0
          fi
          # hasta las 3:00 PM de Guatemala (21:00 UTC) revisa cada minuto; fuera de ese rango, una sola revisión
          while true; do
            python scripts/posdespacho.py --revisar
            if python scripts/posdespacho.py --hay-pendientes; then
              python scripts/posdespacho.py --solo-publicar
              guardar
              break
            fi
            [ "$(date -u +%H)" -ge 21 ] && break
            [ "$(date -u +%H)" -lt 17 ] && break
            sleep 60
          done
